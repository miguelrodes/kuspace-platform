<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Glitterbox — SEP 2, 2016</title>
  <desc id="desc">Original abstract artwork made for the KUSPACE public demo. Not a historical event poster.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#212245"/><stop offset=".7" stop-color="#785783"/><stop offset="1" stop-color="#212245"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#212245" stop-opacity="0"/><stop offset="1" stop-color="#212245" stop-opacity=".96"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <g transform="rotate(-5 600 320)"><rect x="130" y="100" width="220" height="220" fill="none" stroke="#785783" stroke-width="18" opacity=".6"/><rect x="290" y="170" width="220" height="220" fill="none" stroke="#dbb8a6" stroke-width="18" opacity=".6"/><rect x="450" y="240" width="220" height="220" fill="none" stroke="#785783" stroke-width="18" opacity=".6"/><rect x="610" y="100" width="220" height="220" fill="none" stroke="#dbb8a6" stroke-width="18" opacity=".6"/><rect x="770" y="170" width="220" height="220" fill="none" stroke="#785783" stroke-width="18" opacity=".6"/></g><circle cx="905" cy="115" r="84" fill="#dbb8a6" opacity=".5"/>
  <text x="60" y="68" fill="#f6f0e5" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="7">KUSPACE / PUBLIC DEMO</text>
  <text x="1140" y="68" text-anchor="end" fill="#dbb8a6" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">SPACE IBIZA</text>
  <text x="1140" y="112" text-anchor="end" fill="#fff7e9" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">SEP 02 / 2016</text>
  <text x="1125" y="232" text-anchor="end" fill="#ffffff" opacity=".13" font-family="Arial, sans-serif" font-size="210" font-weight="900">2</text>
  <rect y="330" width="1200" height="420" fill="url(#shade)"/>
  <path d="M60 405h1080" stroke="#dbb8a6" stroke-width="3" opacity=".85"/>
  <text x="58" y="535" fill="#fff7e9" font-family="Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-2">GLITTERBOX</text>
